<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>Lattice Animal — a body made of minds</title>
  <defs>
    <radialGradient id="ground" cx="40%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#182348"/>
      <stop offset="55%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>
    <radialGradient id="warmHalo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffe19a" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#ffb266" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffb266" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strokeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>

  <!-- dust and twinkles -->
  <g fill="#f2eee6" opacity="0.35">
    <circle cx="120" cy="80" r="1.6"/>
    <circle cx="900" cy="120" r="1.1"/>
    <circle cx="200" cy="540" r="1.2"/>
    <circle cx="1080" cy="480" r="1.3"/>
    <circle cx="960" cy="60" r="1"/>
    <circle cx="60" cy="320" r="1.1"/>
    <circle cx="1140" cy="300" r="1.0"/>
    <circle cx="340" cy="120" r="0.9"/>
    <circle cx="800" cy="560" r="0.9"/>
    <circle cx="500" cy="80" r="0.9"/>
    <circle cx="80" cy="420" r="0.8"/>
    <circle cx="240" cy="280" r="0.9"/>
    <circle cx="1000" cy="200" r="0.8"/>
    <circle cx="640" cy="540" r="1.1"/>
  </g>

  <!-- warm ambient behind the body -->
  <circle cx="360" cy="315" r="360" fill="url(#warmHalo)"/>

  <!-- ─── lattice animal, positioned on the left side, larger ────────
       Cell grid: 100 px spacing. Origin at (260, 175).
       Shape (P‑pentomino with a tail — 6 cells):
         (0,0) (1,0)
         (0,1) (1,1)
         (0,2)
         (0,3)
  -->

  <!-- faint Voronoi‑ish internal boundaries -->
  <g stroke="#f2eee6" stroke-opacity="0.14" stroke-width="1.6" stroke-linecap="round">
    <line x1="360" y1="125" x2="360" y2="225"/>
    <line x1="360" y1="225" x2="360" y2="325"/>
    <line x1="210" y1="225" x2="510" y2="225"/>
    <line x1="210" y1="325" x2="360" y2="325"/>
    <line x1="260" y1="425" x2="260" y2="325"/>
    <line x1="260" y1="525" x2="260" y2="425"/>
  </g>

  <!-- Perimeter outline -->
  <path d="
    M 210 125 L 510 125 L 510 225 L 360 225 L 360 325 L 310 325 L 310 525 L 210 525 L 210 125 Z"
    fill="none" stroke="#f2eee6" stroke-opacity="0.85" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="
    M 210 125 L 510 125 L 510 225 L 360 225 L 360 325 L 310 325 L 310 525 L 210 525 L 210 125 Z"
    fill="none" stroke="#fff8e0" stroke-opacity="0.55" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- bonds -->
  <g stroke-linecap="round" filter="url(#glow)">
    <line x1="260" y1="175" x2="360" y2="175" stroke="#ffd15c" stroke-width="8"/>
    <line x1="260" y1="175" x2="260" y2="275" stroke="#ffd15c" stroke-width="8"/>
    <line x1="360" y1="175" x2="360" y2="275" stroke="#ffd15c" stroke-width="8"/>
    <line x1="260" y1="275" x2="360" y2="275" stroke="#ffd15c" stroke-width="8"/>
    <line x1="260" y1="275" x2="260" y2="375" stroke="#ffd15c" stroke-width="8"/>
    <line x1="260" y1="375" x2="260" y2="475" stroke="#ffd15c" stroke-width="8"/>
  </g>
  <g stroke="#fff5c8" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <line x1="260" y1="175" x2="360" y2="175"/>
    <line x1="260" y1="175" x2="260" y2="275"/>
    <line x1="360" y1="175" x2="360" y2="275"/>
    <line x1="260" y1="275" x2="360" y2="275"/>
    <line x1="260" y1="275" x2="260" y2="375"/>
    <line x1="260" y1="375" x2="260" y2="475"/>
  </g>

  <!-- 6 minds — each cell -->
  <g>
    <circle cx="260" cy="175" r="30" fill="#ffd15c" opacity="0.55" filter="url(#soft)"/>
    <circle cx="260" cy="175" r="14" fill="#fff5d8"/>
    <circle cx="360" cy="175" r="30" fill="#86bfa8" opacity="0.55" filter="url(#soft)"/>
    <circle cx="360" cy="175" r="14" fill="#fff5d8"/>
    <circle cx="260" cy="275" r="30" fill="#96b2e2" opacity="0.55" filter="url(#soft)"/>
    <circle cx="260" cy="275" r="14" fill="#fff5d8"/>
    <circle cx="360" cy="275" r="30" fill="#e28c6c" opacity="0.55" filter="url(#soft)"/>
    <circle cx="360" cy="275" r="14" fill="#fff5d8"/>
    <circle cx="260" cy="375" r="32" fill="#c8b4f0" opacity="0.55" filter="url(#soft)"/>
    <circle cx="260" cy="375" r="14" fill="#fff5d8"/>
    <circle cx="260" cy="475" r="34" fill="#fff5d8" opacity="0.7" filter="url(#soft)"/>
    <circle cx="260" cy="475" r="14" fill="#ffffff"/>
  </g>

  <!-- ─── title text ─────────────────────────────────────────────── -->
  <g font-family="Fraunces, Georgia, serif">
    <text x="620" y="252" fill="#f2eee6" font-size="70" font-weight="500" letter-spacing="0.5">
      Lattice
    </text>
    <text x="620" y="332" fill="#f2eee6" font-size="70" font-weight="500" letter-spacing="0.5">
      Animal
    </text>
    <text x="620" y="392" fill="#a5c7e6" font-size="24" font-style="italic" opacity="0.88">
      a body made of minds
    </text>
    <text x="620" y="470" fill="#7f8bab" font-size="18" font-family="JetBrains Mono, ui-monospace, monospace" letter-spacing="1.5">
      agreement by position ·
    </text>
    <text x="620" y="497" fill="#7f8bab" font-size="18" font-family="JetBrains Mono, ui-monospace, monospace" letter-spacing="1.5">
      commitment by movement
    </text>
  </g>
</svg>
