<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Lattice Animal</title>
  <!-- ─── cosmic ground ─────────────────────────────────────────────── -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#152040"/>
      <stop offset="55%" stop-color="#080b18"/>
      <stop offset="100%" stop-color="#03040a"/>
    </radialGradient>
    <radialGradient id="warmHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe19a" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#ffb266" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffb266" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- rounded square ground so iOS clips cleanly -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#ground)"/>

  <!-- a scatter of faint dust so the icon has depth -->
  <g fill="#f2eee6" opacity="0.35">
    <circle cx="66" cy="94" r="1.6"/>
    <circle cx="450" cy="128" r="1.1"/>
    <circle cx="112" cy="422" r="1.2"/>
    <circle cx="404" cy="388" r="1.3"/>
    <circle cx="380" cy="70" r="1"/>
    <circle cx="78" cy="288" r="1.1"/>
    <circle cx="432" cy="274" r="1.0"/>
    <circle cx="152" cy="150" r="0.9"/>
    <circle cx="356" cy="450" r="0.9"/>
    <circle cx="216" cy="86" r="0.9"/>
  </g>

  <!-- warm ambient halo behind the body -->
  <circle cx="256" cy="264" r="200" fill="url(#warmHalo)"/>

  <!-- ─── the lattice animal (a P‑pentomino, 5 cells) ────────────────
       Cell grid: 96 px spacing, centered around (256, 264)
       Grid coords (col, row) where (0,0) is the anchor cell:
         (0, 0) (1, 0)
         (0, 1) (1, 1)
         (0, 2)
       Cell centers in world (px):
         (0,0) → (208, 168)
         (1,0) → (304, 168)
         (0,1) → (208, 264)
         (1,1) → (304, 264)
         (0,2) → (208, 360)
  -->

  <!-- Voronoi‑style faint boundary lines between the body's cells -->
  <g stroke="#f2eee6" stroke-opacity="0.14" stroke-width="1.2" stroke-linecap="round">
    <line x1="256" y1="120" x2="256" y2="216"/>
    <line x1="256" y1="216" x2="256" y2="312"/>
    <line x1="160" y1="216" x2="352" y2="216"/>
    <line x1="160" y1="312" x2="256" y2="312"/>
    <line x1="208" y1="408" x2="208" y2="312"/>
  </g>

  <!-- Perimeter outline of the polyomino body (cream, luminous) -->
  <path d="
    M 160 120 L 352 120 L 352 216 L 256 216 L 256 312 L 256 408 L 160 408 L 160 120 Z"
    fill="none" stroke="#f2eee6" stroke-opacity="0.85" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="
    M 160 120 L 352 120 L 352 216 L 256 216 L 256 312 L 256 408 L 160 408 L 160 120 Z"
    fill="none" stroke="#fff8e0" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- warm gold bonds between 4‑adjacent cells -->
  <g stroke-linecap="round" filter="url(#glow)">
    <!-- (0,0) → (1,0) -->
    <line x1="208" y1="168" x2="304" y2="168" stroke="#ffd15c" stroke-width="6"/>
    <!-- (0,0) → (0,1) -->
    <line x1="208" y1="168" x2="208" y2="264" stroke="#ffd15c" stroke-width="6"/>
    <!-- (1,0) → (1,1) -->
    <line x1="304" y1="168" x2="304" y2="264" stroke="#ffd15c" stroke-width="6"/>
    <!-- (0,1) → (1,1) -->
    <line x1="208" y1="264" x2="304" y2="264" stroke="#ffd15c" stroke-width="6"/>
    <!-- (0,1) → (0,2) -->
    <line x1="208" y1="264" x2="208" y2="360" stroke="#ffd15c" stroke-width="6"/>
  </g>

  <!-- inner cream stroke over bonds for crisp core -->
  <g stroke="#fff5c8" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
    <line x1="208" y1="168" x2="304" y2="168"/>
    <line x1="208" y1="168" x2="208" y2="264"/>
    <line x1="304" y1="168" x2="304" y2="264"/>
    <line x1="208" y1="264" x2="304" y2="264"/>
    <line x1="208" y1="264" x2="208" y2="360"/>
  </g>

  <!-- 5 minds — one per cell — each with a colored halo + cream core -->
  <g>
    <!-- (0,0) — amber -->
    <circle cx="208" cy="168" r="26" fill="#ffd15c" opacity="0.55" filter="url(#soft)"/>
    <circle cx="208" cy="168" r="12" fill="#fff5d8"/>
    <!-- (1,0) — teal -->
    <circle cx="304" cy="168" r="26" fill="#86bfa8" opacity="0.55" filter="url(#soft)"/>
    <circle cx="304" cy="168" r="12" fill="#fff5d8"/>
    <!-- (0,1) — soft blue -->
    <circle cx="208" cy="264" r="26" fill="#96b2e2" opacity="0.55" filter="url(#soft)"/>
    <circle cx="208" cy="264" r="12" fill="#fff5d8"/>
    <!-- (1,1) — coral -->
    <circle cx="304" cy="264" r="26" fill="#e28c6c" opacity="0.55" filter="url(#soft)"/>
    <circle cx="304" cy="264" r="12" fill="#fff5d8"/>
    <!-- (0,2) — cream (the newest cell, brightest) -->
    <circle cx="208" cy="360" r="28" fill="#fff5d8" opacity="0.65" filter="url(#soft)"/>
    <circle cx="208" cy="360" r="12" fill="#ffffff"/>
  </g>
</svg>
